name: Apply object note MVP patch

on:
  push:
    branches: [develop]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Apply viewer note input patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/widgets/viewer/visual/entry_page_view.dart')
          s = p.read_text()
          imp = "import 'package:aves/services/object_note_store.dart';\n"
          marker = "import 'package:aves/services/media/media_session_service.dart';\n"
          if imp not in s:
              s = s.replace(marker, marker + imp)
          old = """          onLongPress: canGestureToOtherApps ? _startGlobalDrag : null,\n          onLongPressStart: _onLongPressStart,"""
          new = """          onLongPress: canGestureToOtherApps && !objectNoteModeNotifier.value ? _startGlobalDrag : null,\n          onLongPressStart: _onLongPressStart,"""
          if old not in s:
              raise SystemExit('expected long-press wiring not found')
          s = s.replace(old, new, 1)
          old = """  void _onLongPressStart(BuildContext context, MagnifierState state, Alignment alignment, Offset childTapPosition) {\n    final contentSize = entry.displaySize;\n    if (contentSize.isEmpty) return;\n    final x = (childTapPosition.dx / contentSize.width).clamp(0.0, 1.0);\n    final y = (childTapPosition.dy / contentSize.height).clamp(0.0, 1.0);\n    debugPrint('[ObjectNote MVP] entry=${entry.pageId} x=$x y=$y');\n  }"""
          new = """  Future<void> _onLongPressStart(BuildContext context, MagnifierState state, Alignment alignment, Offset childTapPosition) async {\n    if (!objectNoteModeNotifier.value) return;\n    final contentSize = entry.displaySize;\n    if (contentSize.isEmpty) return;\n    final x = (childTapPosition.dx / contentSize.width).clamp(0.0, 1.0);\n    final y = (childTapPosition.dy / contentSize.height).clamp(0.0, 1.0);\n\n    final controller = TextEditingController();\n    final text = await showDialog<String>(\n      context: context,\n      builder: (dialogContext) => AlertDialog(\n        title: const Text('Добавить заметку'),\n        content: TextField(\n          controller: controller,\n          autofocus: true,\n          textInputAction: TextInputAction.done,\n          decoration: const InputDecoration(hintText: 'Текст заметки'),\n          onSubmitted: (_) => Navigator.of(dialogContext).pop(controller.text),\n        ),\n        actions: [\n          TextButton(\n            onPressed: () => Navigator.of(dialogContext).pop(),\n            child: const Text('Отмена'),\n          ),\n          TextButton(\n            onPressed: () => Navigator.of(dialogContext).pop(controller.text),\n            child: const Text('Сохранить'),\n          ),\n        ],\n      ),\n    );\n    controller.dispose();\n    objectNoteModeNotifier.value = false;\n\n    final trimmed = text?.trim() ?? '';\n    if (trimmed.isEmpty) return;\n    await objectNoteStore.add(ObjectNote(\n      entryKey: entry.uri.toString(),\n      x: x,\n      y: y,\n      text: trimmed,\n      created: DateTime.now().millisecondsSinceEpoch,\n    ));\n    debugPrint('[ObjectNote MVP] saved entry=${entry.pageId} x=$x y=$y text=$trimmed');\n  }"""
          if old not in s:
              raise SystemExit('expected note callback not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Commit and remove patch workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/widgets/viewer/visual/entry_page_view.dart .github/workflows/apply-object-note-mvp.yml
          git commit -m 'Complete MVP object note input and save flow'
          git rm .github/workflows/apply-object-note-mvp.yml
          git commit -m 'Remove temporary object note patch workflow'
          git push origin HEAD:develop
