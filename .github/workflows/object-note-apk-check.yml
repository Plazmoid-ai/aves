name: Object Note APK Check

on:
  push:
    branches:
      - develop
    paths:
      - 'lib/**'
      - 'plugins/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.flutter/**'
      - 'scripts/**'
      - '.github/workflows/object-note-apk-check.yml'

permissions: contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Patch object note dialog context
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/widgets/viewer/visual/entry_page_view.dart')
          s = p.read_text()
          old = '''  Future<void> _onLongPressStart(BuildContext context, MagnifierState state, Alignment alignment, Offset childTapPosition) async {
    if (!objectNoteModeNotifier.value) return;
    final contentSize = entry.displaySize;
    if (contentSize.isEmpty) return;
    final x = (childTapPosition.dx / contentSize.width).clamp(0.0, 1.0);
    final y = (childTapPosition.dy / contentSize.height).clamp(0.0, 1.0);

    final controller = TextEditingController();
'''
          new = '''  Future<void> _onLongPressStart(BuildContext context, MagnifierState state, Alignment alignment, Offset childTapPosition) async {
    if (!objectNoteModeNotifier.value) return;
    if (!context.mounted) return;
    final navigator = Navigator.of(context, rootNavigator: true);
    final contentSize = entry.displaySize;
    if (contentSize.isEmpty) return;
    final x = (childTapPosition.dx / contentSize.width).clamp(0.0, 1.0);
    final y = (childTapPosition.dy / contentSize.height).clamp(0.0, 1.0);

    final controller = TextEditingController();
'''
          if old in s:
              s = s.replace(old, new, 1)
              s = s.replace('''          onSubmitted: (_) => Navigator.of(dialogContext).pop(controller.text),''', '''          onSubmitted: (_) => navigator.pop(controller.text),''', 1)
              s = s.replace('''            onPressed: () => Navigator.of(dialogContext).pop(),''', '''            onPressed: navigator.pop,''', 1)
              s = s.replace('''            onPressed: () => Navigator.of(dialogContext).pop(controller.text),''', '''            onPressed: () => navigator.pop(controller.text),''', 1)
              p.write_text(s)
          else:
              print('Dialog context patch already present')
          PY

      - name: Get Flutter packages
        run: |
          ./flutterw doctor -v
          ./flutterw pub get

      - name: Generate app localizations
        run: ./flutterw gen-l10n

      - name: Build release arm64 APK
        run: |
          ./flutterw build apk -t lib/main_libre.dart --flavor libre --split-per-abi --target-platform android-arm64

      - name: Commit fixed source and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/widgets/viewer/visual/entry_page.dart
          if [ -f .github/workflows/fix-object-note-dialog.yml ]; then
            git rm .github/workflows/fix-object-note-dialog.yml
          fi
          if git diff --cached --quiet; then
            echo 'No source cleanup needed'
          else
            git commit -m "Fix object note dialog context handling"
            git push
          fi

      - name: Upload arm64 APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: object-note-libre-arm64-release
          path: build/app/outputs/apk/libre/release/*arm64-v8a*.apk
