name: Object Note APK Check

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - 'lib/**'
      - 'plugins/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.flutter/**'
      - 'scripts/**'
      - '.github/workflows/object-note-apk-check.yaml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Apply ObjectNote overlay fix
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/widgets/viewer/visual/entry_page_view.dart')
          text = path.read_text()

          if '_buildObjectNotesViewportOverlay' in text:
              print('ObjectNote overlay fix already applied')
              raise SystemExit(0)

          old_overlay_start = '  Widget _buildObjectNotesOverlay() {'
          old_overlay_end = '  Widget _buildRasterView() {'
          start = text.index(old_overlay_start)
          end = text.index(old_overlay_end, start)

          new_overlay = '''  Widget _buildObjectNotesViewportOverlay() {
            return Positioned.fill(
              child: IgnorePointer(
                child: StreamBuilder<MagnifierState>(
                  stream: _magnifierController.stateStream,
                  initialData: _magnifierController.currentState,
                  builder: (context, snapshot) {
                    final boundaries = _magnifierController.scaleBoundaries;
                    final state = snapshot.data;
                    if (boundaries == null || state == null || state.scale == null || _objectNotes.isEmpty) {
                      return const SizedBox.shrink();
                    }

                    final scale = state.scale!;
                    final viewportCenter = boundaries.viewportCenter;
                    final contentCenter = boundaries.contentSize.center(Offset.zero);
                    final contentSize = boundaries.contentSize;

                    return Stack(
                      clipBehavior: Clip.none,
                      children: [
                        for (final note in _objectNotes)
                          Builder(
                            builder: (context) {
                              final contentPosition = Offset(
                                note.x * contentSize.width,
                                note.y * contentSize.height,
                              );
                              final viewportPosition = viewportCenter +
                                  state.position +
                                  (contentPosition - contentCenter) * scale;

                              return Positioned(
                                left: viewportPosition.dx - 14,
                                top: viewportPosition.dy - 14,
                                child: Container(
                                  width: 28,
                                  height: 28,
                                  decoration: BoxDecoration(
                                    color: Colors.red,
                                    shape: BoxShape.circle,
                                    border: Border.all(color: Colors.white, width: 2),
                                  ),
                                  alignment: Alignment.center,
                                  child: const Text(
                                    '•',
                                    style: TextStyle(color: Colors.white, fontSize: 18, height: 1),
                                  ),
                                ),
                              );
                            },
                          ),
                      ],
                    );
                  },
                ),
              ),
            );
          }

          '''
          text = text[:start] + new_overlay + text[end:]

          old_raster = '''  Widget _buildRasterView() {
            return _buildMagnifier(
              applyScale: false,
              child: Stack(
                children: [
                  RasterImageView(
                    entry: entry,
                    viewStateNotifier: _viewStateNotifier,
                    errorBuilder: (context, error, stackTrace) => ErrorView(entry: entry, onTap: _onTap),
                  ),
                  _buildObjectNotesOverlay(),
                ],
              ),
            );
          }

          '''
          new_raster = '''  Widget _buildRasterView() {
            return _buildMagnifier(
              applyScale: false,
              child: RasterImageView(
                entry: entry,
                viewStateNotifier: _viewStateNotifier,
                errorBuilder: (context, error, stackTrace) => ErrorView(entry: entry, onTap: _onTap),
              ),
            );
          }

          '''
          if old_raster not in text:
              raise RuntimeError('Expected raster ObjectNote patch not found')
          text = text.replace(old_raster, new_raster, 1)

          old_svg = '''  Widget _buildSvgView() {
            return _buildMagnifier(
              maxScale: EntryPageView.vectorMaxScale,
              scaleStateCycle: _vectorScaleStateCycle,
              applyScale: false,
              child: Stack(
                children: [
                  VectorImageView(
                    entry: entry,
                    viewStateNotifier: _viewStateNotifier,
                    errorBuilder: (context, error, stackTrace) => ErrorView(entry: entry, onTap: _onTap),
                  ),
                  _buildObjectNotesOverlay(),
                ],
              ),
            );
          }

          '''
          new_svg = '''  Widget _buildSvgView() {
            return _buildMagnifier(
              maxScale: EntryPageView.vectorMaxScale,
              scaleStateCycle: _vectorScaleStateCycle,
              applyScale: false,
              child: VectorImageView(
                entry: entry,
                viewStateNotifier: _viewStateNotifier,
                errorBuilder: (context, error, stackTrace) => ErrorView(entry: entry, onTap: _onTap),
              ),
            );
          }

          '''
          if old_svg not in text:
              raise RuntimeError('Expected SVG ObjectNote patch not found')
          text = text.replace(old_svg, new_svg, 1)

          marker = '    if (!settings.viewerUseCutout) {'
          insertion = '''    if (_objectNotes.isNotEmpty) {
              child = Stack(
                children: [
                  child,
                  _buildObjectNotesViewportOverlay(),
                ],
              );
            }

          '''
          if marker not in text:
              raise RuntimeError('Build insertion point not found')
          text = text.replace(marker, insertion + marker, 1)

          path.write_text(text)
          print('ObjectNote overlay patched outside AvesMagnifier')

      - name: Get Flutter packages
        run: |
          ./flutterw doctor -v
          ./flutterw pub get

      - name: Generate app localizations
        run: ./flutterw gen-l10n

      - name: Remove build ID from native lib
        run: |
          PUB_CACHE=$HOME/.pub-cache
          sed -i -e 's/-Wl,/-Wl,--build-id=none,/' ${PUB_CACHE}/hosted/*/jni-*/src/CMakeLists.txt 2>/dev/null || true

      - name: Prepare release signing
        env:
          KEYSTORE_B64: ${{ secrets.AVES_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.AVES_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AVES_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AVES_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          KEYSTORE_PATH="$RUNNER_TEMP/aves-modbox-release.jks"
          CLEAN_B64=$(printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]')
          echo "Base64 length: ${#CLEAN_B64}"
          echo "Base64 length mod 4: $((${#CLEAN_B64} % 4))"
          INVALID_COUNT=$(printf '%s' "$CLEAN_B64" | LC_ALL=C tr -d 'A-Za-z0-9+/=' | wc -c)
          echo "Invalid Base64 characters: $INVALID_COUNT"
          KEYSTORE_B64="$KEYSTORE_B64" python3 - <<'PY'
          import base64
          import os
          s = ''.join(os.environ['KEYSTORE_B64'].split())
          decoded = base64.b64decode(s, validate=True)
          print(f'Python Base64 validation: OK, decoded bytes: {len(decoded)}')
          PY
          printf '%s' "$CLEAN_B64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          {
            echo "AVES_STORE_FILE=$KEYSTORE_PATH"
            echo "AVES_STORE_PASSWORD=$STORE_PASSWORD"
            echo "AVES_KEY_ALIAS=$KEY_ALIAS"
            echo "AVES_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build release arm64 APK
        run: |
          ./flutterw build apk \
            -t lib/main_libre.dart \
            --flavor libre \
            --split-per-abi \
            --target-platform android-arm64

      - name: Verify APK is signed
        run: |
          APK="build/app/outputs/flutter-apk/app-arm64-v8a-libre-release.apk"
          test -f "$APK"
          ls -lh "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Upload signed arm64 APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: object-note-libre-arm64-release
          path: build/app/outputs/flutter-apk/app-arm64-v8a-libre-release.apk

      - name: Commit ObjectNote overlay fix
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/widgets/viewer/visual/entry_page_view.dart
          if git diff --cached --quiet; then
            echo 'No ObjectNote source changes to commit'
            exit 0
          fi
          git commit -m 'Fix ObjectNote overlay rendering'
          git push origin develop

      - name: Remove temporary keystore
        if: always()
        run: |
          if [ -n "${AVES_STORE_FILE:-}" ]; then
            rm -f "$AVES_STORE_FILE"
          fi
