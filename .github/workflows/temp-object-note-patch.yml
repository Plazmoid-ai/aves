name: Temporary ObjectNote patch

on:
  push:
    branches: [develop]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'TEMP OBJECT NOTE PATCH'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Apply ObjectNote overlay patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/widgets/viewer/visual/entry_page_view.dart')
          s = p.read_text()

          old_raster = '''  Widget _buildRasterView() {
    return _buildMagnifier(
      applyScale: false,
      child: RasterImageView(
        entry: entry,
        viewStateNotifier: _viewStateNotifier,
        errorBuilder: (context, error, stackTrace) => ErrorView(entry: entry, onTap: _onTap),
      ),
    );
  }
'''
          new_raster = '''  Widget _buildRasterView() {
    return _buildMagnifier(
      applyScale: false,
      child: Stack(
        children: [
          RasterImageView(
            entry: entry,
            viewStateNotifier: _viewStateNotifier,
            errorBuilder: (context, error, stackTrace) => ErrorView(entry: entry, onTap: _onTap),
          ),
          _buildObjectNotesOverlay(),
        ],
      ),
    );
  }
'''

          old_svg = '''  Widget _buildSvgView() {
    return _buildMagnifier(
      maxScale: EntryPageView.vectorMaxScale,
      scaleStateCycle: _vectorScaleStateCycle,
      applyScale: false,
      child: VectorImageView(
        entry: entry,
        viewStateNotifier: _viewStateNotifier,
        errorBuilder: (context, error, stackTrace) => ErrorView(entry: entry, onTap: _onTap),
      ),
    );
  }
'''
          new_svg = '''  Widget _buildSvgView() {
    return _buildMagnifier(
      maxScale: EntryPageView.vectorMaxScale,
      scaleStateCycle: _vectorScaleStateCycle,
      applyScale: false,
      child: Stack(
        children: [
          VectorImageView(
            entry: entry,
            viewStateNotifier: _viewStateNotifier,
            errorBuilder: (context, error, stackTrace) => ErrorView(entry: entry, onTap: _onTap),
          ),
          _buildObjectNotesOverlay(),
        ],
      ),
    );
  }
'''

          if old_raster not in s:
              raise SystemExit('Raster block not found; aborting without changes')
          if old_svg not in s:
              raise SystemExit('SVG block not found; aborting without changes')
          if 'Widget _buildObjectNotesOverlay()' in s:
              raise SystemExit('ObjectNote overlay already present; aborting')

          s = s.replace(old_raster, new_raster, 1)
          s = s.replace(old_svg, new_svg, 1)

          anchor = '''  Widget _buildVideoView() {\n'''
          overlay = '''  Widget _buildObjectNotesOverlay() {
    final size = entry.displaySize;
    if (size.isEmpty || _objectNotes.isEmpty) return const SizedBox.shrink();

    return IgnorePointer(
      child: Stack(
        children: [
          for (final note in _objectNotes)
            Positioned(
              left: note.x * size.width - 14,
              top: note.y * size.height - 14,
              child: Container(
                width: 28,
                height: 28,
                decoration: BoxDecoration(
                  color: Colors.red,
                  shape: BoxShape.circle,
                  border: Border.all(color: Colors.white, width: 2),
                ),
                alignment: Alignment.center,
                child: const Text(
                  '•',
                  style: TextStyle(color: Colors.white, fontSize: 18, height: 1),
                ),
              ),
            ),
        ],
      ),
    );
  }

'''
          if anchor not in s:
              raise SystemExit('Video anchor not found; aborting without changes')
          s = s.replace(anchor, overlay + anchor, 1)

          p.write_text(s)
          PY

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/temp-object-note-patch.yml
          git add lib/widgets/viewer/visual/entry_page_view.dart .github/workflows/temp-object-note-patch.yml
          git commit -m "Add ObjectNote markers to viewer"
          git push origin HEAD:develop
